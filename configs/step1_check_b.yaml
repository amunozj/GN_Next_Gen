# Step 1 Check B -- the group-area law, its activity dependence, and whether it is
# stationary.  See docs/plans/step-1-plan.md (Revision 1) and ADR-011.
name: step1_check_b
variant: sunspot_only
seed: 20261121

release: v1.3_4
duplicate_rule: max
kmas_role: reference

# PI, 2026-11-21: Step 1 excludes sporer (tracks no groups) and schwabe (no spotless
# days); see D23.  Schwabe is also calibrated on the umbral scale, so its threshold
# does not apply to area_corr.
surveys: [rgo, debrecen, kmas]
thresholds: [0.0, 10.0, 30.0, 60.0, 100.0]

datasets:
  - path: reference_groups_2026-10
    role: calibration
    kind: sunspot
  - path: area_law_2026-11
    role: calibration
    kind: sunspot
  - path: silso
    role: comparison          # never calibration (ADR-002, ADR-003)
    kind: silso

params:
  # The law is Weibull + log-normal (ADR-011), calibrated upstream and NOT refitted.
  # Only the log-normal's activity dependence is fitted here.
  #
  # Activity level: a 182-day Gaussian on daily sunspot area, in mHem.
  # "emergence" is the 2015 paper's definition -- one peak area per group on its
  # canonical day -- and the published coefficients attach to it.  "instantaneous"
  # sums every group present on the day and runs ~6x larger; it is used for the
  # per-group-day grain bridge.
  activity_weighting: emergence
  activity_scope: whole       # hemispheric is diagnostic only (ADR-004)
  smoothing_sigma_days: 182

  # Equal-count bins: activity is strongly right-skewed, and equal-width bins leave
  # the top bins too thin to fit (the wide error bars of the paper's Fig. 5).
  activity_bins: 10
  min_groups_per_bin: 200

  # Published 2015 coefficients, carried for cross-check only -- never as inputs.
  # c is the LOG-NORMAL weight, so c = 1 - pi_W.
  published_2015:
    k_W: 0.46
    lambda_W: 11.49
    mu_LN: [5.97, 0.021]
    sigma_LN: [1.08, 0.117]
    c_LN: [0.66, 0.230]
